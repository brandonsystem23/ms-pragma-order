server:
  port: 8083

spring:
  application:
    name: order-service

  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 60000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    secret: ${JWT_SECRET:PragmaJwtSecret_2026_fK2mQ9xL7vN4pR6tY3wZ1aB5cD8eF0gH}

clients:
  users:
    base-url: ${USERS_SERVICE_URL:http://localhost:8081}
    path: /api/v1/users/find
  notifications:
    base-url: ${NOTIFICATIONS_SERVICE_URL:http://localhost:8082}
    path: /api/v1/notifications/send
  traceability:
    base-url: ${TRACEABILITY_SERVICE_URL:http://localhost:8084}
    path: /api/v1/traceability/create

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.springframework.r2dbc: DEBUG
    io.r2dbc.postgresql: INFO